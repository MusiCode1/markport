name = "obsidian-web-demo"
compatibility_date = "2025-01-01"
main = "index.js"

# ── Browser file system (OPFS) deployment ─────────────────────────────────────
# Vaults live ENTIRELY in the browser (OPFS). There is NO Durable Object /
# server-side vault storage — this is a client-only static deployment. The
# Worker handles POST /api/proxy-request and the /starter, /vault/* SPA-fallback
# routes (see index.js); everything else is the static asset bundle. The
# system-plugins seed API routes are NOT ported to the Worker — this
# deployment serves a static public/system-plugins/manifest.json fallback
# instead (see index.js's own FOLLOW-UP comment).

# Uncomment and set your own domain:
# routes = [
#   { pattern = "obsidian-web.example.com/*", zone_name = "example.com" }
# ]

# Build output lives outside src/ in the repo's gitignored .tmp/ tree.
# Generated by: scripts/build-assets.sh (run via `npm run build`).
[assets]
directory = "../../../.tmp/deployments/cloudflare/public"

# ── FOLLOW-UP env (once the system-plugins seed Worker routes exist) ──────────
# [vars]
# SYSTEM_PLUGINS_SEED_DISABLED = "obsidian-livesync"   # pre-install LiveSync, disabled
