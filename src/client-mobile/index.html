<!DOCTYPE html>
<html>
<head>
  <!-- Path-based routing (docs/plans/url-routing.md §3א): worker.js ב-vendor
       bundle נטען עם URL יחסי ("worker.js") — תחת /vault/<id> ה-document base
       הוא /vault/, אז ללא <base> זה יפתור ל-/vault/worker.js → 404 → האינדקסר
       מת. <base href="/"> מיישב את כל ה-URLs היחסיים מול השורש בכל path. -->
  <base href="/">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Obsidian Web</title>
  <!-- PWA: installable + home-screen icon + theme -->
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#1e1e1e"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Obsidian Web"/>
  <link rel="apple-touch-icon" href="/client-mobile/icons/icon-180.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/client-mobile/icons/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/client-mobile/icons/favicon-32.png"/>
  <link href="/obsidian-mobile/app.css" type="text/css" rel="stylesheet"/>
  <!-- overrides.css: מסך-רחב (720-899px) — צמצום .mobile-vault-chooser-content
       + מיקום .mobile-onboarding-navbar סמוך לתוכן. path מוחלט (לא יחסי) כי
       <base href="/"> קיים למעלה. חייב לבוא **אחרי** app.css (order+specificity
       גוברים). ראה the mobile-layout-wide brief + overrides.css. -->
  <link href="/client-mobile/overrides.css?v=1" type="text/css" rel="stylesheet"/>
  <style>
    #ow-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--background-primary, #1e1e1e); z-index: 99999;
    }
    #ow-loading .ow-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%; animation: ow-spin 0.7s linear infinite;
    }
    #ow-loading .ow-status {
      color: rgba(255,255,255,0.5);
      font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
    }
    @keyframes ow-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="theme-dark">

  <div id="ow-loading">
    <div class="ow-spinner"></div>
    <div class="ow-status" id="ow-status"></div>
  </div>

  <!-- -1. רישום Service Worker (offline + asset-cache) — non-blocking, נטען
       מוקדם אבל רק מתחיל לפעול אחרי window 'load' (לא מעכב boot).
       ראה docs/plans/service-worker-offline.md §3ב. -->
  <script src="/client-mobile/register-sw.js?v=1"></script>

  <!-- 0. Local vault registry + OPFS store — חייבים להיטען לפני capacitor-shim
       כדי ש-window.__owLocalVaults / window.__owOpfsStore יהיו קיימים כשה-
       Filesystem Proxy (בתוך capacitor-shim) נבנה, וכש-boot.js (בהמשך) קובע
       __owVaultType. ראה docs/plans/opfs-wire.md §4 Commit 3.
       folder-handle-store — חייב להיטען לפני boot.js כדי ש-window.__owFolderHandles
       יהיה קיים כש-boot.js משחזר את ה-directory handle ל-folder vaults (permission
       gate). ראה docs/plans/folder-vault.md §3ד. -->
  <script src="/client-mobile/local-vault-registry.js?v=1"></script>
  <script src="/client-mobile/storage/opfs-store.js?v=1"></script>
  <script src="/client-mobile/storage/folder-handle-store.js?v=1"></script>

  <!-- 0d. Pure vault-root-path detection (docs/plans/electron-shim-foundation.md
       §3.3) — consumed by capacitor-shim.js's Filesystem.readFile to answer
       EISDIR instead of a raw fetch-404/ENOENT when the desktop-only
       Vault.readRaw("") empty-vault probe reads the vault root as a file. -->
  <script src="/client-mobile/vault-root-path.js?v=1"></script>

  <!-- 0b. Pull-sync engine (the pull-sync brief §2) — v1 =
       OPFS-local vaults only. Must load before boot.js so
       window.__owSync* are ready when boot.js mounts the "Sync now" button
       (guarded on window.__owVaultType==='local' + a stored config). Order
       among these 5 doesn't matter at load time (each only touches the
       others' window.__owSync* globals inside async functions, never at
       top-level) — grouped in brief §2's file order for readability. -->
  <script src="/client-mobile/sync/decide-pull.js?v=1"></script>
  <script src="/client-mobile/sync/hash-store.js?v=1"></script>
  <script src="/client-mobile/sync/local-manifest.js?v=1"></script>
  <script src="/client-mobile/sync/remote-client.js?v=1"></script>
  <script src="/client-mobile/sync/run-pull.js?v=1"></script>

  <!-- 0c. מקור-אמת יחיד לגרסת Obsidian המסופקת (docs/plans/
       electron-shim-foundation.md §3.0) — חייב לפני capacitor-shim.js
       (App.getInfo קורא ממנו) ולפני shims/electron.js/boot.js. GENERATED —
       ראה obsidian-version.js עצמו. -->
  <script src="/client-mobile/obsidian-version.js?v=1"></script>

  <!-- 1. Capacitor shim — חייב לפני native-bridge.js כדי שandroidBridge יהיה
       מוגדר כשהbridge מאתחל את הplatform. -->
  <script src="/client-mobile/shims/capacitor-shim.js?v=1"></script>

  <!-- 2. Capacitor native bridge (מה-APK). -->
  <script src="/obsidian-mobile/native-bridge.js?v=1"></script>

  <!-- 3. שימי עזר לפלאגינים שמשתמשים ב-require(). -->
  <script src="/client-mobile/shims/path.js?v=1"></script>
  <script src="/client-mobile/shims/url.js?v=1"></script>
  <script src="/client-mobile/shims/os.js?v=1"></script>
  <script src="/client-mobile/shims/btime.js?v=1"></script>

  <!-- 3a. Bootstrap cache helpers — pure lookups + invalidation,
       attached to window.__owBootstrapLookup / __owCacheInvalidation.
       Capacitor shim's Filesystem.{readFile,stat,readdir} consult them
       before falling back to HTTP, saving 100+ round-trips at cold boot. -->
  <script src="/client-mobile/bootstrap-lookup.js?v=1"></script>
  <script src="/client-mobile/cache-invalidation.js?v=1"></script>

  <!-- 3b. seed-on-boot של system plugins (מתג obsidian-web-layout וכו') ל-OPFS
       (local) vaults — server vaults מקבלים אותם דרך overlay צד-שרת קיים
       (/api/fs). חייב לפני boot.js כדי ש-window.__owSeedSystemPlugins יהיה
       קיים כש-boot.js קורא לו אחרי אימות ה-vault. ראה
       docs/plans/opfs-seed-system-plugins.md §3. -->
  <script src="/client-mobile/seed-system-plugins.js?v=1"></script>

  <!-- 3c. seed-on-boot של תוכן-דוגמה (Welcome/Features) לתוך vault ריק — CF
       static בלבד (example-vault.json קיים רק ב-build של ה-CF deployment;
       מקומי מדלג, 404). לא נוגע ב-.obsidian/ — ראה docs/plans/cf-mobile-seed.md
       §3ג. חייב לפני boot.js כדי ש-window.__owSeedExampleVault יהיה קיים. -->
  <script src="/client-mobile/seed-example-vault.js?v=1"></script>

  <!-- 3d. Deploy-config (docs/plans/deploy-config.md §3) — deploy-time config
       (seedExampleContent/layout/plugins), loaded BEFORE boot.js so
       window.__owConfig is ready when boot.js reads it. The marker below is
       replaced with `<script>window.__owConfigInjected={...}</script>` at
       build-time (CF: build-assets.sh) or serve-time (Node: runtime-server's
       sendHtmlWithCacheBust) — it MUST precede the deploy-config.js tag,
       otherwise the loader silently falls back to DEFAULTS (order is
       critical, see deploy-config.js comment). No injection (local/no-config)
       → marker stays a no-op comment → DEFAULTS alone, zero regression. -->
  <!-- OW_CONFIG_INJECT -->
  <script src="/client-mobile/deploy-config.js?v=1"></script>

  <!-- 3e. Platform bridge (docs/plans/runtime-platform-descriptors.md §2/§3) —
       wraps Object.defineProperty to capture Obsidian's Platform object at
       runtime. This, plus docs/plans/zero-patches.md, removed every build-time
       patch: vendor/obsidian-mobile/app.js is byte-identical to Obsidian's own
       APK. MUST load before boot.js: boot.js sets
       window.__owPlatformOverrides synchronously at its top level, and the
       bridge reads that lazily (only once it captures Platform, which
       happens much later, after app.js is injected) — see brief §3.0 for
       the full load-order diagram. Classic script (not type="module") —
       index.html only supports classic scripts here (brief §3.7#9). -->
  <script src="/client-mobile/platform-bridge.js?v=1"></script>

  <!-- 3f. Electron shim (docs/plans/electron-shim-foundation.md §3.1,
       docs/plans/desktop-layout-now.md §1-§5) — window.electron +
       require('electron') (registered by boot.js's modules map, right
       below). MUST load before boot.js: boot.js reads window.electron
       synchronously when building its modules map. Reads
       window.__owObsidianVersion lazily (only inside its sendSync/getVersion
       handlers, never at module-eval time) — obsidian-version.js above
       already ran by the time either is ever called. -->
  <script src="/client-mobile/shims/electron.js?v=1"></script>

  <!-- 4. Boot: vault selection, window.require, desktop cleanup.
       Obsidian's scripts (i18next, enhance, i18n, app.js) are injected
       DYNAMICALLY by boot.js after vault verification — same mechanism as
       the desktop client. This keeps the spinner visible and lets us report
       loading progress. -->
  <script src="/client-mobile/boot.js?v=1"></script>

</body>
</html>
